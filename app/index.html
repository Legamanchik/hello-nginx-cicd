<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hello, World!</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #0f172a; color: #e2e8f0;
    }
    main { text-align: center; padding: 16px; }
    h1 { font-size: clamp(2rem, 8vw, 4rem); margin: 0 0 .5rem; }
    p { color: #94a3b8; margin: .25rem 0; }
    code { color: #38bdf8; }
  </style>
</head>
<body>
  <main>
    <h1>Hello, World!</h1>
    <p>Served by Nginx in Docker, deployed by GitHub Actions.</p>
    <p>Version: <code>__APP_VERSION__</code></p>
  </main>
</body>
</html>
