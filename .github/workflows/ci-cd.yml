name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_NAME: ${{ vars.DOCKERHUB_USERNAME }}/hello-nginx
  IMAGE_TAG: ${{ github.sha }}
  TRIVY_IMAGE: aquasec/trivy:0.76.1

jobs:
  lint:
    name: Lint code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Hadolint (Dockerfile)
        run: docker run --rm -i hadolint/hadolint:v2.12.0 < Dockerfile

      - name: ShellCheck (scripts)
        run: shellcheck scripts/*.sh

  iac:
    name: Check infrastructure code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false

      - name: Terraform fmt
        run: terraform fmt -check -recursive -diff terraform

      - name: Terraform validate
        run: |
          for dir in terraform terraform/state-bucket; do
            terraform -chdir="$dir" init -backend=false -input=false >/dev/null
            terraform -chdir="$dir" validate
          done

      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.66.0

      - name: TFLint
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tflint --chdir=terraform --recursive --init
          tflint --chdir=terraform --recursive --format compact

      - name: Kubernetes manifests (kubeconform)
        run: |
          {
            kubectl kustomize k8s;          echo ---
            kubectl kustomize monitoring;   echo ---
            cat argocd/root.yaml
            for f in argocd/apps/*.yaml; do echo ---; cat "$f"; done
          } | docker run --rm -i ghcr.io/yannh/kubeconform:v0.8.0 \
                -strict -summary -kubernetes-version 1.36.0 \
                -schema-location default \
                -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' -

      - name: Security misconfigurations (Trivy config)
        run: |
          docker run --rm -v "$PWD:/src" -w /src "$TRIVY_IMAGE" config \
            --severity HIGH,CRITICAL --exit-code 1 .

  build:
    name: Build, test, scan, push
    needs: [lint, iac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image
        run: ./scripts/deploy.sh build

      - name: Smoke test
        run: |
          docker run -d --name smoke -p 8080:8080 \
            --read-only --tmpfs /tmp --tmpfs /var/cache/nginx --cap-drop ALL \
            "$IMAGE_NAME:$IMAGE_TAG"
          for _ in $(seq 1 15); do
            curl -fsS http://localhost:8080/healthz && break
            sleep 1
          done
          curl -fsS http://localhost:8080/ | grep -q "Hello, World!"
          curl -fsS http://localhost:8080/version.txt | grep -qx "$IMAGE_TAG"
          echo "Smoke test passed"

      - name: Smoke test logs
        if: always()
        run: docker logs smoke || true

      - name: Vulnerability scan (Trivy)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            "$TRIVY_IMAGE" image \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress \
            "$IMAGE_NAME:$IMAGE_TAG"

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image
        if: github.event_name != 'pull_request'
        run: ./scripts/deploy.sh push

  deploy:
    name: Deploy to server 1 (Docker)
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: test
      url: https://${{ vars.SITE_DOMAIN }}/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy via AWS SSM
        env:
          DEPLOY_METHOD: ssm
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_INSTANCE_ID: ${{ vars.DEPLOY_INSTANCE_ID }}
          SITE_DOMAIN: ${{ vars.SITE_DOMAIN }}
        run: ./scripts/deploy.sh deploy

  gitops:
    name: Update k8s manifests (Argo CD)
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Bump image in k8s/kustomization.yaml
        run: |
          sed -i -E \
            -e "s|^(\s*newName:).*|\1 ${IMAGE_NAME}|" \
            -e "s|^(\s*newTag:).*|\1 ${IMAGE_TAG}|" \
            k8s/kustomization.yaml
          if git diff --quiet; then
            echo "Manifests already point to ${IMAGE_TAG}"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Update k8s image to ${IMAGE_TAG::7} [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            echo "Push attempt ${attempt} failed, retrying"
            sleep 5
          done
          exit 1
