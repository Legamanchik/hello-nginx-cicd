apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hello-nginx
  labels:
    app.kubernetes.io/name: hello-nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - 51-20-48-179.sslip.io
      secretName: hello-nginx-tls
  rules:
    - host: 51-20-48-179.sslip.io
      http: &paths
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hello-nginx
                port:
                  name: http
    - http: *paths
