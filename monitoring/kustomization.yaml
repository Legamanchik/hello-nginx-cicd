apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - grafana-reviewer.yaml
configMapGenerator:
  - name: dashboard-hello-nginx
    files:
      - dashboards/hello-nginx.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
