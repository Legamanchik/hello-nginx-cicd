apiVersion: v1
kind: ServiceAccount
metadata:
  name: reviewer
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: reviewer-view
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: reviewer
    namespace: kube-system
---
apiVersion: v1
kind: Secret
metadata:
  name: reviewer-token
  namespace: kube-system
  annotations:
    kubernetes.io/service-account.name: reviewer
type: kubernetes.io/service-account-token
