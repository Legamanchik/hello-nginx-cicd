apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hello-nginx
  labels:
    app.kubernetes.io/name: hello-nginx
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hello-nginx
                port:
                  name: http
