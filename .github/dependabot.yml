version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: terraform
    directories:
      - /terraform
      - /terraform/state-bucket
    schedule:
      interval: weekly
    groups:
      terraform:
        patterns: ["*"]
